    qty_per_run: 1
    # Le spray est 3 à 5x plus cher au litre que le bidon : on le refuse.
    hard_constraints:
      - "format not in (spray)"
    attribute_rules:
      format:
        spray: [spray, pulvérisateur prêt, vaporisateur]
        bidon: [bidon, 5 l, 5l]
    fallback_advice: Toujours le bidon 5 L + un pulvérisateur réutilisable.

