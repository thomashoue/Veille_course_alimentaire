  # ---------------- Épicerie ----------------
  - id: tomate_conserve
    label: Tomates en conserve (purée / pelées / concassées)
    category: conserve
    unit: kg
    keywords: [purée de tomates, puree de tomates, chair de tomate, tomates pelées,
               tomates pelees, tomates concassées, tomates concassees, coulis de tomate,
