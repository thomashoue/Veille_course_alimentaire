# Panier type — §2.2. Environ la moitié est non alimentaire : la veille couvre
# tout le panier, pas seulement l'alimentaire.
#
# unit               : unité de comparaison (le prix normalisé est TOUJOURS ramené là)
# bulk_worthy        : poste où l'achat en gros est rentable
# hard_constraints   : contraintes de conformité évaluées AVANT le prix
# attribute_rules    : comment déduire un attribut du libellé du drive
#                      (ordre significatif : la première règle qui matche gagne)
# out_of_scope_drive : article qu'on achète hors drive (Grand Frais, marché)

