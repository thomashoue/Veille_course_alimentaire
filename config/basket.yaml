# Panier type — §2.2. Environ la moitié est non alimentaire : la veille couvre
# tout le panier, pas seulement l'alimentaire.
#
# unit               : unité de comparaison (le prix normalisé est TOUJOURS ramené là)
# bulk_worthy        : poste où l'achat en gros est rentable
# hard_constraints   : contraintes de conformité évaluées AVANT le prix
# attribute_rules    : comment déduire un attribut du libellé du drive
#                      (ordre significatif : la première règle qui matche gagne)
# out_of_scope_drive : article qu'on achète hors drive (Grand Frais, marché)

items:
  # ---------------- Crèmerie ----------------
  - id: lait_demi_ecreme
    label: Lait demi-écrémé
    category: cremerie
    unit: L
    bulk_worthy: true
    keywords: [lait demi-écrémé, lait demi ecreme]
    qty_per_run: 12        # deux packs de 6x1L
    qty_stock: 24

  - id: emmental_rape
    label: Emmental râpé
    category: cremerie
    unit: kg
    keywords: [emmental râpé, emmental rape]
    qty_per_run: 0.5

  - id: mozzarella
    label: Mozzarella
    category: cremerie
    unit: kg
    keywords: [mozzarella]
    qty_per_run: 0.4

  - id: comte
    label: Comté
    category: cremerie
    unit: kg
    keywords: [comté, comte]
    exclude_keywords: [saucisson, chips, biscuit, aperitif]
    qty_per_run: 0.3

  - id: oeufs
    label: Œufs
    category: cremerie
    unit: unite
    keywords: [œufs, oeufs]
    exclude_keywords: [creme, dessert, clafoutis, yaourt, flan]
    qty_per_run: 12

  - id: beurre
    label: Beurre demi-sel
    category: cremerie
    unit: kg
    keywords: [beurre]
    exclude_keywords: [cacahuete, cacahuètes, dessert, gateau, biscuit]
    qty_per_run: 1

  # ---------------- Épicerie ----------------
  - id: legumineuses_seches
    label: Légumineuses sèches
    category: epicerie
    unit: kg
    bulk_worthy: true
    keywords: [lentilles, pois chiches, haricots secs, légumes secs]
    qty_per_run: 2
    qty_stock: 6

  - id: conserve_poisson
    label: Conserves de poisson
    category: conserve
    unit: kg
    bulk_worthy: true
    keywords: [sardines, thon, maquereaux]
    qty_per_run: 0.6       # ~6 boîtes de 93 g net
    qty_stock: 2.5
    stock_unit: boite      # l'inventaire compte les boîtes (le kg sert au prix)
    weight_basis_required: true

  - id: cafe
    label: Café
    category: epicerie
    unit: kg
    bulk_worthy: true
    keywords: [café moulu, cafe moulu, café grains]
    qty_per_run: 1
    qty_stock: 3

  - id: pates
    label: Pâtes
    category: epicerie
    unit: kg
    keywords: [pâtes, spaghetti, penne, coquillettes]
    qty_per_run: 2

  - id: riz
    label: Riz
    category: epicerie
    unit: kg
    keywords: [riz]
    exclude_keywords: [chorizo, gateau de riz]
    qty_per_run: 1

  - id: huile_olive
    label: Huile d'olive
    category: epicerie
    unit: L
    keywords: [huile d'olive, huile olive]
    # « Sardines à l'huile d'olive » est une conserve, pas de l'huile :
    # la préparation emprunte le nom de l'ingrédient.
    exclude_keywords: [sardine, thon, maquereau, filet, conserve, boite, boîte,
                       poisson, rillette, tomate, escabeche, piment]
    qty_per_run: 1

  # ---------------- Viande ----------------
  - id: steak_hache
    label: Steak haché
    category: viande
    unit: kg
    # 5 % ou 15 % MG, frais ou surgelé : le %MG change le prix, à comparer à
    # taux égal — l'attribut le rend visible dans le rapport.
    keywords: [steak haché, steak hache, steaks hachés, haché pur bœuf, haché 5%, haché 15%]
    exclude_keywords: [bacon, burger surgele, wrap, cordon]
    attribute_rules:
      mg:
        "5": [5% mg, 5 % mg, "5%", matière grasse 5]
        "15": [15% mg, 15 % mg, "15%", matière grasse 15]
        "20": [20% mg, 20 % mg, "20%"]
    qty_per_run: 1

  - id: poulet
    label: Filet de poulet
    category: viande
    unit: kg
    keywords: [filet de poulet, escalope de poulet]
    exclude_keywords: [wrap, sandwich, nuggets, pane, cordon, plat]
    qty_per_run: 1

  # ---------------- Animalerie ----------------
  - id: litiere_chat
    label: Litière chat
    category: animalerie
    unit: L
    bulk_worthy: true
    keywords: [litière, litiere]
    # « Litière rongeurs P'tit Ami 15L » est passée pour une litière chat le
    # 2026-08-31 : le rayon animalerie mélange les espèces, pas le panier.
    exclude_keywords: [rongeur, lapin, hamster, gerbille, furet, oiseau,
                       chinchilla, cochon d'inde, souris]
    qty_per_run: 10        # un sac de 10 L
    qty_stock: 30          # en vraie promo, on stocke trois sacs
    # §2.2 : contrainte NON négociable. Une litière hors de ces deux types
    # n'est pas une affaire, c'est un hors-sujet.
    hard_constraints:
      - "type in (silice, agglo_charbon)"
    attribute_rules:
      type:
        silice: [silice, cristaux, silica, gel de silice]
        agglo_charbon: [charbon actif, charbon-actif, agglomérante charbon, charbon]
        vegetale: [végétale, vegetale, bois, rafle, tofu, papier, chanvre]
        minerale: [argile, bentonite, minérale, minerale, sépiolite]
    fallback_advice: >-
      Aucune promo conforme (silice / agglomérante charbon actif) : acheter au
      prix courant plutôt que d'attendre — repère U 5 L charbon actif à 0,92 €/L.

  - id: croquettes_chat
    label: Croquettes chat
    category: animalerie
    unit: kg
    bulk_worthy: true
    keywords: [croquettes chat, croquettes]
    exclude_keywords: [chien, chiot]
    qty_per_run: 2
    qty_stock: 9

  - id: sacs_litiere
    label: Sacs à litière
    category: animalerie
    unit: unite
    keywords: [sac à litière, sacs litière]
    qty_per_run: 1

  # ---------------- Droguerie ----------------
  - id: lessive
    label: Lessive
    category: droguerie
    unit: dose
    bulk_worthy: true
    keywords: [lessive]
    qty_per_run: 45        # un bidon ou un sac de capsules
    qty_stock: 90

  - id: papier_toilette
    label: Papier toilette
    category: droguerie
    unit: rouleau
    bulk_worthy: true
    keywords: [papier toilette, papier hygiénique]
    qty_per_run: 24
    qty_stock: 48

  - id: liquide_vaisselle
    label: Liquide vaisselle
    category: droguerie
    unit: L
    keywords: [liquide vaisselle]
    qty_per_run: 1

  - id: vinaigre
    label: Vinaigre blanc
    category: droguerie
    unit: L
    bulk_worthy: true
    keywords: [vinaigre blanc, vinaigre ménager]
    qty_per_run: 5         # le bidon
    qty_stock: 10
    # Le spray est 3 à 5x plus cher au litre que le bidon : on le refuse.
    hard_constraints:
      - "format not in (spray)"
    attribute_rules:
      format:
        spray: [spray, pulvérisateur prêt, vaporisateur]
        bidon: [bidon, 5 l, 5l]
    fallback_advice: Toujours le bidon 5 L + un pulvérisateur réutilisable.

  - id: papier_cuisson
    label: Papier cuisson
    category: droguerie
    unit: m
    keywords: [papier cuisson, papier sulfurisé]
    qty_per_run: 20       # un rouleau = ~20 m

  - id: essuie_tout
    label: Essuie-tout
    category: droguerie
    unit: rouleau
    keywords: [essuie-tout, essuie tout]
    qty_per_run: 6

  # ---------------- Hygiène ----------------
  - id: gel_douche
    label: Gel douche
    category: hygiene
    unit: L
    keywords: [gel douche]
    qty_per_run: 2

  - id: dentifrice
    label: Dentifrice
    category: hygiene
    unit: unite
    keywords: [dentifrice]
    qty_per_run: 2

  - id: shampooing
    label: Shampooing
    category: hygiene
    unit: L
    keywords: [shampooing, shampoing]
    qty_per_run: 1

  # ---------------- Bière ----------------
  - id: biere
    label: Bière
    category: biere
    unit: L
    keywords: [bière, biere]
    qty_per_run: 1

  # ============================================================================
  # Produits intégrés depuis la commande Drive Intermarché du 07/09/2026.
  # Objectif : suivre chaque BESOIN pour comparer l'équivalent le moins cher
  # entre enseignes (prix normalisé au kg/L/unité), pas la marque distributeur.
  # ============================================================================

