  # ---------------- Animalerie ----------------
  - id: litiere_chat
    label: Litière chat
    category: animalerie
    unit: L
    bulk_worthy: true
    keywords: [litière, litiere]
    # « Litière rongeurs P'tit Ami 15L » est passée pour une litière chat le
    # 2026-08-31 : le rayon animalerie mélange les espèces, pas le panier.
    exclude_keywords: [rongeur, lapin, hamster, gerbille, furet, oiseau,
                       chinchilla, cochon d'inde, souris]
    qty_per_run: 1
    # §2.2 : contrainte NON négociable. Une litière hors de ces deux types
    # n'est pas une affaire, c'est un hors-sujet.
    hard_constraints:
      - "type in (silice, agglo_charbon)"
    attribute_rules:
      type:
        silice: [silice, cristaux, silica, gel de silice]
        agglo_charbon: [charbon actif, charbon-actif, agglomérante charbon, charbon]
        vegetale: [végétale, vegetale, bois, rafle, tofu, papier, chanvre]
        minerale: [argile, bentonite, minérale, minerale, sépiolite]
    fallback_advice: >-
      Aucune promo conforme (silice / agglomérante charbon actif) : acheter au
      prix courant plutôt que d'attendre — repère U 5 L charbon actif à 0,92 €/L.

  - id: croquettes_chat
    label: Croquettes chat
    category: animalerie
    unit: kg
    bulk_worthy: true
    keywords: [croquettes chat, croquettes]
    exclude_keywords: [chien, chiot]
