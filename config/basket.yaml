  - id: legumineuses_conserve
    label: Légumineuses en conserve (haricots rouges, pois chiches…)
    category: conserve
    unit: kg
    # « net égoutté » : le prix doit se comparer sur le poids égoutté, jamais
    # sur le poids brut (§5, piège brut vs net).
    weight_basis_required: true
    keywords: [haricots rouges, pois chiches, lentilles cuisinées, flageolets,
               haricots blancs]
    exclude_keywords: [secs, sèches, seches, sachet, soupe]
    qty_per_run: 0.5      # deux boîtes de 250 g net

  - id: haricots_verts_conserve
