# Banque de recettes — dîners sans viande (poisson autorisé), doux pour les
# enfants (6 et 10 ans), équilibrés, budget maîtrisé.
#
# La liste de courses part du BESOIN : la commande `menu` choisit 7 dîners,
# agrège les ingrédients, et produit la liste — reliée à la veille prix.
#
# servings_base : nombre de parts pour lequel les quantités sont données.
#   Foyer : 2 adultes + 2 enfants ≈ 4 parts.
# tags : vegetarien | poisson | rapide (<30 min) | four | mijote | batch
#        (batch = se congèle / se garde bien) | saison_hiver | saison_ete
# ingredients : chaque ligne relie si possible à un article du panier
#   (`basket_item`, pour la veille prix) ; sinon un libellé frais avec sa
#   `category` ('fl' = fruits/légumes hors périmètre drive → marché/Grand Frais).

servings_base: 4

